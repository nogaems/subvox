[project]
name = "subvox"
version = "0.1.0"
description = "Offline subtitles for videos in languages you don't speak"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "faster-whisper>=1.1",
    "ctranslate2>=4.5",
    "pysubs2>=1.7",
    "sentencepiece>=0.2",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cudnn-cu12>=9",
    "nvidia-cublas-cu12>=12",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
subvox = "subvox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subvox"]

[tool.ruff]
line-length = 100
target-version = "py312"
